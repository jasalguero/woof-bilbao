<style>
/* Layout: editorial riverside page. Big left-aligned type, a river line that runs between sections, ink-blue and rust. */
:root{
  --bg:#eef2f1; --surface:#fff; --ink:#12303d; --muted:#4d6670; --water:#cfe0e3; --accent:#c2481f; --accent-ink:#fff; --line:#b9cdd1;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; --body:"Hanken Grotesk",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1e26;--surface:#142b35;--ink:#e6efee;--muted:#9bb3ba;--water:#1c3a46;--accent:#ee7b52;--accent-ink:#0d1e26;--line:#2a4954;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1e26;--surface:#142b35;--ink:#e6efee;--muted:#9bb3ba;--water:#1c3a46;--accent:#ee7b52;--accent-ink:#0d1e26;--line:#2a4954;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;text-decoration:none}
.brand b{color:var(--accent)}
nav{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:500;font-size:.95rem}
nav a:hover{color:var(--accent)}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{font:500 .8rem var(--mono);background:none;color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:end;padding-block:48px 64px}
.hero h1{font-size:clamp(2.6rem,7.2vw,5.6rem);font-weight:800}
.hero p.sub{font-size:1.2rem;max-width:34ch;margin-top:22px;color:var(--muted)}
.hero .acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-block;font:700 1rem var(--body);background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);padding:14px 26px;border-radius:4px;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.ph{position:relative;display:grid;place-items:center;min-height:200px;background:repeating-linear-gradient(135deg,var(--water) 0 14px,transparent 14px 28px),var(--surface);border:1.5px solid var(--line);color:var(--muted);font:500 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:10px}
.hero .ph{aspect-ratio:4/5;max-width:100%}
.hero .ph::after{content:"43.2630° N · 2.9350° W";position:absolute;left:12px;bottom:10px;font-size:.68rem;opacity:.8}
.river{display:block;width:100%;height:60px;color:var(--water)}
section{padding-block:72px}
.about{display:grid;grid-template-columns:5fr 7fr;gap:48px}
.about h2{grid-column:1}
.about .txt{display:grid;gap:18px;font-size:1.12rem;max-width:62ch}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:56px;border-top:2px solid var(--ink)}
.pillar{padding:24px 24px 8px 0}
.pillar+.pillar{padding-left:24px;border-left:1.5px solid var(--line)}
.pillar h3{font-size:1.5rem;margin-bottom:8px}
.pillar p{color:var(--muted)}
.day{background:var(--ink);color:var(--bg)}
.day h2{margin-bottom:44px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:2px dashed color-mix(in srgb,var(--bg) 45%,transparent)}
.steps li{position:relative;padding:44px 24px 0 0}
.steps li::before{content:"";position:absolute;top:2px;left:0;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--ink)}
.steps h3{font-size:1.35rem;margin-bottom:6px}
.steps p{opacity:.8;font-size:.98rem}
:root[data-theme="dark"] .day{background:var(--surface);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day{background:var(--surface);color:var(--ink)}}
.dogs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;margin-top:40px}
.dog .ph{aspect-ratio:1/1}
.dog h3{font-size:2.4rem;margin-top:16px;font-weight:800}
.dog p{color:var(--muted);margin-top:6px}
.dog .mono{margin-top:10px;display:block}
.dogs-intro{max-width:50ch;margin-top:16px;color:var(--muted);font-size:1.1rem}
.book{display:grid;grid-template-columns:4fr 7fr;gap:56px;align-items:start}
.book .intro{position:sticky;top:24px}
.book .intro p{margin-top:16px;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);padding:32px;border-radius:4px}
.form{display:grid;gap:26px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:16px;min-width:0}
legend{font:500 .78rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 0 10px;border-bottom:1.5px solid var(--line);width:100%;margin-bottom:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
label,.lbl{font-weight:500;font-size:.92rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:3px;padding:11px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.checks{display:grid;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{margin-top:5px;accent-color:var(--accent)}
.days{display:flex;gap:8px;flex-wrap:wrap}
.day input{position:absolute;opacity:0}
label.day{position:relative;display:inline-grid;place-items:center;width:46px;height:46px;border:1.5px solid var(--line);border-radius:50%;cursor:pointer;font-family:var(--mono);background:var(--bg)}
label.day:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.day:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.error{color:var(--accent);font-weight:700}
.ok h3{font-size:2rem;font-family:var(--display)}
.ok p{margin:10px 0 18px;color:var(--muted)}
.ok dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 24px}
.ok dt{font:500 .75rem var(--mono);text-transform:uppercase;color:var(--muted);padding-top:3px}
.ok dd{margin:0;overflow-wrap:anywhere}
footer{border-top:1.5px solid var(--line);padding-block:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:820px){
  .hero,.about,.book{grid-template-columns:1fr}
  .hero .ph{aspect-ratio:16/10}
  .pillars{grid-template-columns:1fr}.pillar+.pillar{padding-left:0;border-left:0;border-top:1.5px solid var(--line)}
  .steps{grid-template-columns:1fr 1fr;row-gap:28px}.steps::before{display:none}.steps li{padding-top:34px}
  .dogs-grid{grid-template-columns:1fr}
  .book .intro{position:static}.card{padding:20px}
  section{padding-block:52px}
}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
</style>
</head>

    <div class="field"><label for="f-notes" data-i18n="f_notes"></label><textarea id="f-notes" name="notes" rows="2"></textarea></div>
  </fieldset>
  <label class="check"><input type="checkbox" name="consent" required><span data-i18n="f_consent"></span></label>
  <p id="form-error" class="error" role="alert" hidden></p>
  <button class="btn" type="submit" data-i18n="f_submit"></button>
</form>
<div id="form-ok" class="ok" hidden>

</div>
</div>
  </div>
</div></section>
