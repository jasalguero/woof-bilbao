<form id="booking" class="form" novalidate>
  <fieldset><legend data-i18n="f_owner"></legend>
    <div class="field"><label for="f-name" data-i18n="f_name"></label><input id="f-name" name="name" autocomplete="name" required></div>
    <div class="row">
      <div class="field"><label for="f-email" data-i18n="f_email"></label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="f-phone" data-i18n="f_phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
    </div>
  </fieldset>
  <fieldset><legend data-i18n="f_dog"></legend>
    <div class="row">
      <div class="field"><label for="f-dogname" data-i18n="f_dogname"></label><input id="f-dogname" name="dogname" required></div>
      <div class="field"><label for="f-breed" data-i18n="f_breed"></label><input id="f-breed" name="breed" data-i18n-ph="f_breed_ph"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-age" data-i18n="f_age"></label><input id="f-age" name="age" data-i18n-ph="f_age_ph" required></div>
      <div class="field"><label for="f-size" data-i18n="f_size"></label>
        <select id="f-size" name="size" required><option value="" data-i18n="s_pick"></option><option value="s" data-i18n="s_s"></option><option value="m" data-i18n="s_m"></option><option value="l" data-i18n="s_l"></option></select></div>
      <div class="field"><label for="f-sex" data-i18n="f_sex"></label>
        <select id="f-sex" name="sex"><option value="" data-i18n="s_pick"></option><option value="m" data-i18n="sx_m"></option><option value="f" data-i18n="sx_f"></option></select></div>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" name="neutered"><span data-i18n="f_neutered"></span></label>
      <label class="check"><input type="checkbox" name="vacc" required><span data-i18n="f_vacc"></span></label>
    </div>
    <div class="field"><label for="f-med" data-i18n="f_med"></label><textarea id="f-med" name="med" rows="3" data-i18n-ph="f_med_ph"></textarea></div>
    <div class="field"><label for="f-pref" data-i18n="f_pref"></label><textarea id="f-pref" name="pref" rows="3" data-i18n-ph="f_pref_ph"></textarea></div>
  </fieldset>
  <fieldset><legend data-i18n="f_dates"></legend>
    <div class="row">
      <div class="field"><label for="f-from" data-i18n="f_from"></label><input id="f-from" name="from" type="date" required></div>
      <div class="field"><label for="f-to" data-i18n="f_to"></label><input id="f-to" name="to" type="date" required></div>
    </div>
    <div class="field"><span class="lbl" data-i18n="f_days"></span>
      <div class="days">
        <label class="day"><input type="checkbox" name="d1" checked><span data-i18n="dw1"></span></label>
        <label class="day"><input type="checkbox" name="d2" checked><span data-i18n="dw2"></span></label>
        <label class="day"><input type="checkbox" name="d3" checked><span data-i18n="dw3"></span></label>
        <label class="day"><input type="checkbox" name="d4" checked><span data-i18n="dw4"></span></label>
        <label class="day"><input type="checkbox" name="d5" checked><span data-i18n="dw5"></span></label>
      </div></div>
    <div class="field"><label for="f-notes" data-i18n="f_notes"></label><textarea id="f-notes" name="notes" rows="2"></textarea></div>
  </fieldset>
  <label class="check"><input type="checkbox" name="consent" required><span data-i18n="f_consent"></span></label>
  <p id="form-error" class="error" role="alert" hidden></p>
  <button class="btn" type="submit" data-i18n="f_submit"></button>
</form>
<div id="form-ok" class="ok" hidden>
  <h3 data-i18n="ok_title"></h3><p data-i18n="ok_text"></p><dl></dl>
  <button id="form-edit" class="btn ghost" type="button" data-i18n="ok_again"></button>
</div>
