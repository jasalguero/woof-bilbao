<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woof Bilbao Patas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: playful sticker sheet. Chunky outlines, hard offset shadows, tilted labels, centered hero, yellow ground. */
:root{
  --bg:#ffe27a; --surface:#fffaf0; --ink:#1d1b3a; --pop:#ff5a36; --pop-ink:#fff; --mint:#8fe3cf; --sky:#a9c8ff; --shadow:#1d1b3a;
  --display:"Bagel Fat One","Arial Rounded MT Bold",Arial,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b3a;--surface:#2a2753;--ink:#fff3c4;--pop:#ff7a58;--pop-ink:#1d1b3a;--mint:#3e9c88;--sky:#5576b8;--shadow:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b3a;--surface:#2a2753;--ink:#fff3c4;--pop:#ff7a58;--pop-ink:#1d1b3a;--mint:#3e9c88;--sky:#5576b8;--shadow:#000;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(2.2rem,6vw,3.6rem)}
p{margin:0}
:focus-visible{outline:4px solid var(--pop);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px}
.brand{font-family:var(--display);font-size:1.6rem;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
nav a{color:var(--ink);text-decoration:none;font-weight:800;padding:6px 12px;border-radius:99px}
nav a:hover{background:var(--surface)}
.lang{display:inline-flex;gap:4px}
.lang button{font:800 .85rem var(--body);color:var(--ink);background:var(--surface);border:3px solid var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{text-align:center;padding-block:36px 72px;position:relative}
.sticker{display:inline-block;background:var(--mint);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:6px 18px;font-weight:800;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--shadow)}
.hero h1{font-size:clamp(2.8rem,9vw,6.4rem);margin:26px auto 18px;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--pop);display:inline-block;transform:rotate(-2deg)}
.hero .sub{max-width:36ch;margin:0 auto;font-size:1.25rem}
.acts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;font:800 1.05rem var(--body);background:var(--pop);color:var(--pop-ink);border:3px solid var(--ink);border-radius:99px;padding:14px 30px;text-decoration:none;box-shadow:5px 5px 0 var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.ph{display:grid;place-items:center;text-align:center;min-height:180px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--sky) 55%,transparent) 0 12px,transparent 12px 24px),var(--surface);border:3px solid var(--ink);border-radius:28px;color:var(--ink);font-weight:800;font-size:.9rem;padding:10px;box-shadow:6px 6px 0 var(--shadow)}
.hero .ph{max-width:760px;margin:56px auto 0;aspect-ratio:16/8;transform:rotate(-1deg)}
.blob{background:var(--surface);border:3px solid var(--ink);border-radius:32px;box-shadow:7px 7px 0 var(--shadow);padding:34px}
section{padding-block:56px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.about p+p{margin-top:14px}
.about h2{margin-bottom:20px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}
.pillar{border:3px solid var(--ink);border-radius:28px;padding:26px;box-shadow:6px 6px 0 var(--shadow)}
.pillar:nth-child(1){background:var(--mint);transform:rotate(-1.2deg)}
.pillar:nth-child(2){background:var(--sky);transform:rotate(.8deg)}
.pillar:nth-child(3){background:var(--surface);transform:rotate(-.6deg)}
.pillar h3{font-size:1.6rem;margin-bottom:8px}
:root[data-theme="dark"] .pillar{color:var(--ink)}
.day-title{text-align:center;margin-bottom:36px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.stop{background:var(--surface);border:3px solid var(--ink);border-radius:28px;padding:22px;box-shadow:5px 5px 0 var(--shadow);position:relative}
.stop::before{content:"";position:absolute;top:-14px;left:22px;width:24px;height:24px;border-radius:50%;background:var(--pop);border:3px solid var(--ink)}
.stop h3{font-size:1.35rem;margin:6px 0}
.stop p{font-size:.98rem}
.dogs{text-align:center}
.dogs .intro{max-width:44ch;margin:14px auto 0}
.dogs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px;margin-top:44px;text-align:left}
.dog .ph{aspect-ratio:1/1;border-radius:50% 50% 28px 28px}
.dog:nth-child(1) .ph{transform:rotate(-2deg)}.dog:nth-child(2) .ph{transform:rotate(2deg)}
.dog h3{font-size:2.6rem;margin-top:22px;color:var(--pop)}
.dog small{display:inline-block;margin-top:8px;font-weight:800;opacity:.7}
.book-head{text-align:center;margin-bottom:30px}.book-head p{max-width:46ch;margin:14px auto 0}
.form{display:grid;gap:28px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:16px;min-width:0}
legend{font-family:var(--display);font-size:1.5rem;color:var(--pop);margin-bottom:6px;padding:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
label,.lbl{font-weight:800;font-size:.95rem}
input,select,textarea{font:600 1rem var(--body);color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:11px 14px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pop);flex:none}
input:focus,select:focus,textarea:focus{outline:4px solid var(--pop);outline-offset:1px}
.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.days{display:flex;gap:10px;flex-wrap:wrap}
.day input{position:absolute;opacity:0}
label.day{position:relative;display:inline-grid;place-items:center;width:50px;height:50px;border:3px solid var(--ink);border-radius:50%;cursor:pointer;background:var(--bg);font-family:var(--display);font-weight:400;font-size:1.1rem}
label.day:has(input:checked){background:var(--pop);color:var(--pop-ink);box-shadow:3px 3px 0 var(--shadow)}
label.day:has(input:focus-visible){outline:4px solid var(--ink);outline-offset:2px}
.error{background:var(--pop);color:var(--pop-ink);border-radius:16px;padding:10px 16px;font-weight:800}
.ok h3{font-size:2.2rem;color:var(--pop)}.ok p{margin:10px 0 18px}
.ok dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 24px}.ok dt{font-weight:800}.ok dd{margin:0;overflow-wrap:anywhere}
footer{padding-block:30px;text-align:center;font-weight:800}
@media (max-width:860px){
  .about,.pillars,.dogs-grid{grid-template-columns:1fr}
  .path{grid-template-columns:1fr 1fr}
  .hero .ph{aspect-ratio:16/10}.blob{padding:22px}
}
@media (max-width:480px){.path{grid-template-columns:1fr}.pillar{transform:none!important}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.pic{padding:0;overflow:hidden}
.il{--il-sw:3.5;--il-line:#1d1b3a;--il-sky:#a9c8ff;--il-sun:#ffe27a;--il-hill2:#8fe3cf;--il-hill1:#5cc9ad;--il-water:#4f7cff;--il-ground:#7fdc8c;--il-bg1:#8fe3cf;--il-bg2:#a9c8ff;--il-c1:#ff5a36;--il-pink:#ff8fb1}
/* Shared illustration palette; designs override --il-* tokens */
.il{display:block;width:100%;height:100%}
.il .o{stroke:var(--il-line,#2b2340);stroke-width:var(--il-sw,3);stroke-linejoin:round;stroke-linecap:round}
.il .tail{fill:none!important;stroke-width:calc(var(--il-sw,3)*4)}
.il .line{stroke:var(--il-line,#2b2340);fill:none}
.il .fur1{fill:var(--il-fur1,#c98a4b);stroke:var(--il-line,#2b2340)}
.il .tail.fur1{stroke:var(--il-fur1,#c98a4b)}.il .tail.fur3{stroke:var(--il-fur3,#f1dcb5)}.il .tail.fur4{stroke:var(--il-fur4,#4a3a35)}
.il .fur2{fill:var(--il-fur2,#7a4b2a)}
.il .fur3{fill:var(--il-fur3,#f1dcb5)}
.il .fur4{fill:var(--il-fur4,#4a3a35)}
.il .light{fill:var(--il-light,#fff3e2)}
.il .dark{fill:var(--il-dark,#2b2340)}
.il .white{fill:#fff}
.il .pink{fill:var(--il-pink,#ff8fa3)}
.il .blush{fill:var(--il-pink,#ff8fa3);opacity:.45}
.il .collar{fill:var(--il-c1,#e5533d)}.il .collar2{fill:var(--il-c2,#3b8fe0)}.il .collar3{fill:var(--il-c3,#3fbf7f)}
.il .tag,.il .sun,.il .ball{fill:var(--il-sun,#ffcc3d)}
.il .bow{fill:var(--il-pink,#ff8fa3)}
.il .sky{fill:var(--il-sky,#cde7f5)}
.il .hill2{fill:var(--il-hill2,#9fcf9a)}.il .hill1{fill:var(--il-hill1,#6fb27a)}
.il .water{fill:var(--il-water,#5aa6c8)}.il .wave{stroke:var(--il-wave,#bfe3f1);stroke-width:3;stroke-linecap:round}
.il .ground{fill:var(--il-ground,#8fc46a)}
.il .bridge{fill:var(--il-bridge,#fff);stroke:var(--il-bridge,#fff)}
.il .wall{fill:var(--il-wall,#ffe9c7)}.il .door{fill:var(--il-door,#e5533d)}
.il .bowl{fill:var(--il-c2,#3b8fe0)}.il .kibble{fill:var(--il-fur2,#7a4b2a)}
.il .cushion{fill:var(--il-cushion,#b99ce8)}
.il .zzz{fill:var(--il-line,#2b2340);font:700 28px system-ui,sans-serif}
.il .bg1{fill:var(--il-bg1,#ffd6a8)}.il .bg2{fill:var(--il-bg2,#cfe3ff)}
.il .ti1{fill:var(--il-ti1,#cfd5dc)}.il .ti2{fill:var(--il-ti2,#aab3bd)}.il .ti3{fill:var(--il-ti3,#e6eaef)}
.il .seam{stroke:var(--il-seam,#8a939d);stroke-width:1.5}
.il .glass{fill:var(--il-glass,#8fc3dc)}.il .tower{fill:var(--il-tower,#7fa7bf)}
.il .salve{stroke:var(--il-salve,#d9362b)}.il .deck{fill:var(--il-deck,#6d7a86)}
.il .track{stroke:var(--il-line,#2b2340)}.il .fun{fill:var(--il-fun,#d9362b)}
.il .puppy{fill:var(--il-puppy,#5aa857)}
.il .fl1{fill:#ff7fb5}.il .fl2{fill:#ffd93b}.il .fl3{fill:#b79cff}.il .fl4{fill:#fff}.il .fl5{fill:#ff8a3d}
.il.skyline{height:auto;aspect-ratio:1200/220}
.il .arch{fill:none}
</style>
</head>
