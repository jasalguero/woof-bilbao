name: Backend tests

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend-tests.yml"]
  push:
    paths: ["supabase/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validation unit tests
        run: deno test supabase/functions/submit-booking/
      - name: Type-check the Edge Function
        run: deno check supabase/functions/submit-booking/index.ts
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime
      - name: Database tests
        run: supabase test db
