name: Backend tests

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend-tests.yml"]
  push:
    paths: ["supabase/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function unit tests (form validation, email templates, sender)
        run: deno test supabase/functions/
      - name: Type-check the Edge Functions
        run: deno check supabase/functions/submit-booking/index.ts supabase/functions/send-messages/index.ts
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime
      - name: Database tests (all files in supabase/tests/database)
        run: supabase test db
