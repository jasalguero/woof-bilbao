[package]
name = "woof-bilbao-staff"
version = "0.1.0"
description = "Woof Bilbao staff app"
authors = ["Woof Bilbao"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "woof_bilbao_staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
# Desktop notifications for new booking requests.
tauri-plugin-notification = "2"
log = "0.4"
# generate_context! emits serde_json for the `plugins` section of tauri.conf.json.
serde_json = "1"
# Signed auto-updates from GitHub Releases (see README "Releases and updates"),
# and relaunching the app after an update is installed.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
