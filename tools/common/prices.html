<div class="prices" data-prices>
  <h2 data-i18n="pr_title"></h2>
  <p class="prices-intro" data-i18n="pr_intro"></p>
  <div class="price-cards">
    <div class="price-card">
      <span class="price-name" data-i18n="pr_day"></span>
      <strong class="price-amount" data-price="day"></strong>
      <span class="price-note" data-i18n="pr_day_note"></span>
    </div>
    <div class="price-card">
      <span class="price-name" data-price-text="pack_name"></span>
      <strong class="price-amount" data-price="pack"></strong>
      <span class="price-note" data-price-text="pack_note"></span>
    </div>
  </div>
  <p class="price-vat" data-price-text="vat"></p>
  <p class="price-vat" data-price-text="second" hidden></p>
</div>
